<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="35%" style="stop-color:#16213e"/>
      <stop offset="70%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6c63ff"/>
      <stop offset="50%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#6c63ff"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="50%" style="stop-color:#f472b6"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="rounded">
      <rect width="200" height="200" rx="44"/>
    </clipPath>
  </defs>

  <!-- Base rounded rect -->
  <rect width="200" height="200" rx="44" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.06" clip-path="url(#rounded)">
    <line x1="0" y1="0" x2="200" y2="200" stroke="white" stroke-width="0.5"/>
    <line x1="33" y1="0" x2="200" y2="167" stroke="white" stroke-width="0.5"/>
    <line x1="66" y1="0" x2="200" y2="134" stroke="white" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="200" y2="100" stroke="white" stroke-width="0.5"/>
    <line x1="133" y1="0" x2="200" y2="67" stroke="white" stroke-width="0.5"/>
    <line x1="166" y1="0" x2="200" y2="33" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="33" x2="167" y2="200" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="66" x2="134" y2="200" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="100" y2="200" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="133" x2="67" y2="200" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="166" x2="33" y2="200" stroke="white" stroke-width="0.5"/>
  </g>

  <!-- Decorative accent ring -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.6"/>
  <circle cx="100" cy="100" r="78" fill="none" stroke="url(#accent)" stroke-width="0.5" opacity="0.3" stroke-dasharray="8 12"/>

  <!-- Geometric diamond in background -->
  <polygon points="100,35 140,75 100,115 60,75" fill="none" stroke="white" stroke-width="0.8" opacity="0.15"/>
  <polygon points="100,55 125,75 100,95 75,75" fill="none" stroke="white" stroke-width="0.5" opacity="0.1"/>

  <!-- Accent dots -->
  <circle cx="40" cy="50" r="3" fill="url(#accent)" opacity="0.7"/>
  <circle cx="160" cy="50" r="2" fill="url(#accent)" opacity="0.5"/>
  <circle cx="35" cy="160" r="2.5" fill="url(#accent)" opacity="0.5"/>
  <circle cx="165" cy="155" r="3" fill="url(#accent)" opacity="0.6"/>

  <!-- Letter Z monogram -->
  <text x="100" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="100" font-weight="bold" fill="url(#textGrad)" filter="url(#glow)" letter-spacing="-2">Z</text>

  <!-- Small decorative line under letter -->
  <line x1="65" y1="148" x2="135" y2="148" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="75" y1="153" x2="125" y2="153" stroke="url(#accent)" stroke-width="1" stroke-linecap="round" opacity="0.4"/>

  <!-- Shine overlay -->
  <rect width="200" height="200" rx="44" fill="url(#bg)" opacity="0">
    <animate attributeName="opacity" values="0;0.05;0" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
